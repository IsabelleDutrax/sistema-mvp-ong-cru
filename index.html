<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>MVP Doações</title>
  <!-- Bootstrap 5 (componentes de Modal/Formulário) - carregado antes do style.css
       para que nossos estilos customizados continuem tendo prioridade -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons/css/all/all.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h2 {
      margin-top: 30px;
    }

    input,
    button {
      margin: 5px;
      padding: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #f2f2f2;
    }

    .hidden {
      display: none;
    }

    .section {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <!-- Login / Signup -->
  <div id="login-container" class="login-container">
    <div class="login-card">
      <div class="logo-circle">💰</div>
      <h1>MVP Doações - Supabase</h1>
      <div id="auth-section" class="section auth-section">
        <h2>Login / Cadastro</h2>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email">
        </div>
        <div class="form-group">
          <div class="password-block">
            <input type="password" id="password" placeholder="Senha" oninput="toggleSenhaBtn()">
            <button id="btn-toggle-senha" class="btn-icon" type="button" title="Ver ou ocultar senha" onclick="viewSenha()" disabled>
              <i id="icon-password" class="fi fi-rr-eye-crossed"></i>
            </button>

          </div>
        </div>
        <button class="btn-block" onclick="signIn()">Entrar</button>
        <div class="auth-links">
          <a onclick="signUp()">Cadastrar</a>
          <!-- <button class="icon-btn" onclick="signOut()" title="Sair"><i class="fi fi-rr-exit"></i></button> -->
        </div>
      </div>
    </div>
  </div>

  <!-- Barra compacta exibida após o login -->
  <div id="logged-in-bar" class="logged-in-bar hidden">
    <div class="logo-circle logo-circle-sm">💰</div>
    <span class="logged-in-text">Logado como <strong id="userEmailDisplay"></strong></span>
    <button class="icon-btn" onclick="signOut()" title="Sair">
      <i class="fi fi-rr-exit"></i> Sair
    </button>
  </div>

  <!-- Doadores -->
  <div id="doador-section" class="section hidden">
    <h2>Doadores</h2>
    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalNovoDoador">
      Novo Doador +
    </button>

    <!-- Modal: Novo Doador (Bootstrap 5) -->
    <div class="modal fade" id="modalNovoDoador" tabindex="-1" aria-labelledby="modalNovoDoadorLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalNovoDoadorLabel">Novo Doador</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <form id="formNovoDoador">
              <div class="mb-3">
                <label for="doadorNome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="doadorNome" placeholder="Nome" required>
              </div>
              <div class="mb-3">
                <label for="doadorTelefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="doadorTelefone" placeholder="Telefone">
              </div>
              <div class="mb-3">
                <label for="doadorCpf" class="form-label">CPF/CNPJ</label>
                <input type="text" class="form-control" id="doadorCpf" placeholder="CPF/CNPJ">
              </div>
              <div class="mb-3">
                <label for="doadorEndereco" class="form-label">Endereço</label>
                <input type="text" class="form-control" id="doadorEndereco" placeholder="Endereço">
              </div>
              <div class="mb-3">
                <label for="doadorEmail" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="doadorEmail" placeholder="E-mail">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success" onclick="addDoador()">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <table id="doadorTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefone</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Doações -->
  <div id="doacao-section" class="section hidden">
    <h2>Doações</h2>
    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalNovaDoacao">
      Nova Doação +
    </button>

    <!-- Modal: Nova Doação (Bootstrap 5) -->
    <div class="modal fade" id="modalNovaDoacao" tabindex="-1" aria-labelledby="modalNovaDoacaoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalNovaDoacaoLabel">Nova Doação</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <form id="formNovaDoacao">
              <div class="mb-3">
                <label for="idDoador" class="form-label">Id do Doador</label>
                <input type="text" class="form-control" id="idDoador" placeholder="Id do Doador" required>
              </div>
              <div class="mb-3">
                <label for="doacaoValor" class="form-label">Valor</label>
                <input type="number" class="form-control" id="doacaoValor" placeholder="Valor">
              </div>
              <div class="mb-3">
                <label for="doacaoData" class="form-label">Data</label>
                <input type="date" class="form-control" id="doacaoData">
              </div>
              <div class="mb-3">
                <label for="doacaoForma" class="form-label">Forma de Pagamento</label>
                <input type="text" class="form-control" id="doacaoForma" placeholder="Forma de Pagamento">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success" onclick="addDoacao()">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <table id="doacaoTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Doador</th>
          <th>Valor</th>
          <th>Data</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Interações -->
  <div id="interacao-section" class="section hidden">
    <h2>Interações</h2>
    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalNovaInteracao">
      Nova Interação +
    </button>

    <!-- Modal: Nova Interação (Bootstrap 5) -->
    <div class="modal fade" id="modalNovaInteracao" tabindex="-1" aria-labelledby="modalNovaInteracaoLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalNovaInteracaoLabel">Nova Interação</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <form id="formNovaInteracao">
              <div class="mb-3">
                <label for="idDoadorInteracao" class="form-label">ID do Doador</label>
                <input type="text" class="form-control" id="idDoadorInteracao" placeholder="ID do Doador" required>
              </div>
              <div class="mb-3">
                <label for="tipoInteracao" class="form-label">Tipo</label>
                <input type="text" class="form-control" id="tipoInteracao" placeholder="Tipo">
              </div>
              <div class="mb-3">
                <label for="observacoes" class="form-label">Observações</label>
                <input type="text" class="form-control" id="observacoes" placeholder="Observações">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-success" onclick="addInteracaoNova()">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <table id="interacaoTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Doador ID</th>
          <th>Tipo</th>
          <th>Obs</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Bootstrap 5 JS (Modal, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 🔑 Config Supabase
    const SUPABASE_URL = "https://qsiisduhdqecxuemdcjp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cbNKYP7-t9VWYp4tYqNaVQ_OPKA2d55";
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);


    let currentUser = null;
    let currentDoadorId = null;
    let isAdmin = false;

    // =========================
    // 🔐 AUTH
    // =========================



    //Email: admin@admin.com
    //Senha: 123123


    //Email: alvesisabele370@gmail.com
    //Senha: 123123


    async function signIn() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) return alert("Erro: " + error.message);

      currentUser = data.user;

      // Checa se o usuário é admin
      const { data: doadorData } = await supabaseClient
        .from("doador")
        .select("nivel_acesso")
        .eq("id_usuario", currentUser.id)
        .single();

      isAdmin = doadorData && doadorData.nivel_acesso === 99;

      // alert("Login OK! Admin: " + isAdmin);
      Swal.fire({
        icon: 'success',
        title: 'Successo!',
        text: `Login OK! Admin:${isAdmin}`,
        position: 'top-right',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
        toast: true,

        animation: true,
      })
      loadData();
      toggleSections(true);
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      toggleSections(false);
      // alert("Saiu!");
      Swal.fire({
        icon: 'success',
        title: 'Saiu!',
        position: 'top-right',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
        toast: true,

        animation: true,
      })
    }

    function toggleSections(show) {
      document.getElementById("login-container").classList.toggle("hidden", show);
      document.getElementById("logged-in-bar").classList.toggle("hidden", !show);
      if (show && currentUser) {
        document.getElementById("userEmailDisplay").textContent = currentUser.email;
      }
      document.getElementById("doador-section").classList.toggle("hidden", !show);
      document.getElementById("doacao-section").classList.toggle("hidden", !show);
      document.getElementById("interacao-section").classList.toggle("hidden", !show);
    }

    // Fecha o modal do Bootstrap e limpa os campos do formulário
    function fecharModal(modalId, formId) {
      const modalEl = document.getElementById(modalId);
      bootstrap.Modal.getOrCreateInstance(modalEl).hide();
      document.getElementById(formId).reset();
    }

    // =========================
    // 🧑 DOADOR NOVO
    // =========================
    async function loadDoadores() {
      const { data, error } = await supabaseClient.from("doador_novo").select("*");
      if (error) return console.error(error);

      const tbody = document.querySelector("#doadorTable tbody");
      tbody.innerHTML = "";
      data.forEach(d => {
        tbody.innerHTML += `<tr>
      <td>${d.id_doador}</td>
      <td>${d.nome}</td>
      <td>${d.email || ""}</td>
      <td>${d.telefone || ""}</td>
      <td>
        <button onclick="updateDoador(${d.id_doador})"><i class="fi fi-rr-pencil"></i></button>
        <button onclick="deleteDoador(${d.id_doador})"><i class="fi fi-rr-trash"></i></button>
      </td>
    </tr>`;
      });
    }

    async function addDoador() {
      const nome = document.getElementById("doadorNome").value.trim();
      const telefone = document.getElementById("doadorTelefone").value;
      const cpf = document.getElementById("doadorCpf").value;
      const endereco = document.getElementById("doadorEndereco").value;
      const email = document.getElementById("doadorEmail").value || ''; // opcional

      if (!nome) return alert("Informe o nome do doador!");

      const { error } = await supabaseClient.from("doador_novo").insert({ nome, telefone, cpf_cnpj: cpf, endereco, email });
      if (error) return alert("Erro: " + error.message);

      fecharModal("modalNovoDoador", "formNovoDoador");
      loadDoadores();
    }

    async function updateDoador(id) {
      const nome = prompt("Novo nome do doador:");
      const telefone = prompt("Novo telefone:");
      const cpf = prompt("Novo CPF/CNPJ:");
      const endereco = prompt("Novo endereço:");
      const email = prompt("Novo email (opcional):");

      const updateData = {};
      if (nome) updateData.nome = nome;
      if (telefone) updateData.telefone = telefone;
      if (cpf) updateData.cpf_cnpj = cpf;
      if (endereco) updateData.endereco = endereco;
      if (email) updateData.email = email;

      const { error } = await supabaseClient.from("doador_novo").update(updateData).eq("id_doador", id);
      if (error) return alert("Erro: " + error.message);
      loadDoadores();
    }


    async function deleteDoador(id) {
      if (!confirm("Tem certeza que deseja deletar este doador?")) return;
      const { error } = await supabaseClient.from("doador_novo").delete().eq("id_doador", id);
      if (error) return alert("Erro: " + error.message);
      loadDoadores();
    }

    // =========================
    // 💸 DOAÇÃO NOVA
    // =========================
    async function loadDoacoes() {
      const { data, error } = await supabaseClient.from("doacao_nova").select("*");
      if (error) return console.error(error);

      const tbody = document.querySelector("#doacaoTable tbody");
      tbody.innerHTML = "";
      data.forEach(d => {
        tbody.innerHTML += `<tr>
      <td>${d.id_doacao}</td>
      <td>${d.id_doador}</td>
      <td>${d.valor}</td>
      <td>${d.data_doacao || ""}</td>
      <td>${d.status || ""}</td>
      <td>
        <button onclick="updateDoacao(${d.id_doacao})"><i class="fi fi-rr-pencil"></i></button>
        <button onclick="deleteDoacao(${d.id_doacao})"><i class="fi fi-rr-trash"></i></button>
      </td>
    </tr>`;
      });
    }

    async function addDoacao() {
      const valor = document.getElementById("doacaoValor").value;
      const dataDoacao = document.getElementById("doacaoData").value;
      const forma = document.getElementById("doacaoForma").value;
      const idDoador = document.getElementById("idDoador").value;

      if (!idDoador) return alert("Informe o Id do Doador!");

      // Verificar se o ID do doador existe na tabela doadores
      const { data: doador, error: doadorError } = await supabaseClient
        .from("doador_novo")
        .select("id_doador") // Seleciona todo o conteúdo (ou só "id_doador" para otimizar)
        .eq("id_doador", idDoador)
        .single();

      // Tratamento dos erros ou ausência do doador no banco
      if (doadorError || !doador) {
        return alert("Doador não encontrado! Verifique o ID informado.");
      }

      const { error } = await supabaseClient.from("doacao_nova").insert({
        id_doador: parseInt(idDoador),
        valor: parseFloat(valor),
        data_doacao: dataDoacao,
        forma_pagamento: forma
      });
      if (error) return alert("Erro: " + error.message);

      fecharModal("modalNovaDoacao", "formNovaDoacao");
      loadDoacoes();
    }

    async function updateDoacao(id) {
      const valor = prompt("Novo valor:");
      const forma = prompt("Nova forma de pagamento:");
      const status = prompt("Novo status:");

      const updateData = {};
      if (valor) updateData.valor = parseFloat(valor);
      if (forma) updateData.forma_pagamento = forma;
      if (status) updateData.status = status;

      const { error } = await supabaseClient.from("doacao_nova").update(updateData).eq("id_doacao", id);
      if (error) return alert("Erro: " + error.message);
      loadDoacoes();
    }

    async function deleteDoacao(id) {
      if (!confirm("Deseja deletar esta doação?")) return;
      const { error } = await supabaseClient.from("doacao_nova").delete().eq("id_doacao", id);
      if (error) return alert("Erro: " + error.message);
      loadDoacoes();
    }


    // =========================
    // 📞 INTERAÇÃO NOVA
    // =========================
    async function loadInteracoes() {
      console.log("load das interações");
      let query = supabaseClient.from("interacao_nova").select("*");
      // if (!isAdmin) query = query.eq("id_doador", currentDoadorId);

      const { data, error } = await query;
      if (error) return console.error(error);

      const tbody = document.querySelector("#interacaoTable tbody");
      tbody.innerHTML = "";
      data.forEach(i => {
        tbody.innerHTML += `<tr>
      <td>${i.id_interacao}</td>
      <td>${i.id_doador || ""}</td>
      <td>${i.tipo_interacao}</td>
      <td>${i.observacoes || ""}</td>
      <td>${i.data_interacao}</td>
      <td>
        <button onclick="updateInteracaoNova(${i.id_interacao})"><i class="fi fi-rr-pencil"></i></button>
        ${isAdmin ? `<button onclick="deleteInteracaoNova(${i.id_interacao})"><i class="fi fi-rr-trash"></i></button>` : ""}
      </td>
    </tr>`;
      });
    }

    async function addInteracaoNova() {
      const tipo = document.getElementById("tipoInteracao").value;
      const obs = document.getElementById("observacoes").value;
      const idDoador = document.getElementById("idDoadorInteracao").value || '';

      if (!idDoador) return alert("Informe o ID do Doador!");

      // Verificar se o ID do doador existe na tabela doadores
      const { data: doador, error: doadorError } = await supabaseClient
        .from("doador_novo")
        .select("id_doador") // Seleciona todo o conteúdo (ou só "id_doador" para otimizar)
        .eq("id_doador", idDoador)
        .single();

      // Tratamento dos erros ou ausência do doador no banco
      if (doadorError || !doador) {
        return alert("Doador não encontrado! Verifique o ID informado.");
      }

      const { error } = await supabaseClient.from("interacao_nova").insert({
        id_doador: parseInt(idDoador),
        id_usuario: currentUser.id,
        tipo_interacao: tipo,
        observacoes: obs
      });
      if (error) return alert("Erro: " + error.message);

      Swal.fire({
        icon: 'success',
        title: 'Successo!',
        text: "Interação adicionada com sucesso!",
        position: 'top-right',
        showConfirmButton: false,
        timer: 1500,
        timerProgressBar: true,
        toast: true,
      })

      fecharModal("modalNovaInteracao", "formNovaInteracao");
      loadInteracoes();
    }

    async function updateInteracaoNova(id) {
      const tipo = prompt("Novo tipo:");
      const obs = prompt("Nova observação:");
      const { error } = await supabaseClient.from("interacao_nova")
        .update({ tipo_interacao: tipo, observacoes: obs })
        .eq("id_interacao", id);
      if (error) return alert("Erro: " + error.message);
      loadInteracoes();
    }

    async function deleteInteracaoNova(id) {
      if (!isAdmin) return alert("Somente admins podem deletar interações");
      if (!confirm("Deseja deletar esta interação?")) return;

      const { error } = await supabaseClient.from("interacao_nova")
        .delete()
        .eq("id_interacao", id);
      if (error) return alert("Erro: " + error.message);
      loadInteracoes();
    }


    // =========================
    // 🚀 Load inicial
    // =========================
    async function loadData() {
      await loadDoadores();
      await loadDoacoes();
      await loadInteracoes();
    }

    function viewSenha() {
      var tipo = document.getElementById("password")
      var icon = document.getElementById("icon-password")


      if (tipo.type == "password") {
        tipo.type = "text";
        icon.className = "fi fi-rr-eye";
      } else {
        tipo.type = "password";
        icon.className = "fi fi-rr-eye-crossed";
      }
    }

    function toggleSenhaBtn() {
      var senha = document.getElementById("password");
      var btn = document.getElementById("btn-toggle-senha");
      btn.disabled = senha.value.length === 0;
    }


  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
